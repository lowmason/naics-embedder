base_margin: 0.5
base_model_name: sentence-transformers/all-MiniLM-L6-v2
child_eval_top_k: 5
curriculum_anneal:
  alpha_end: 0.8
  alpha_start: 1.5
  enabled: false
  epochs: 50
  metric_direction: below
  metric_name: adaptive_margin_mean
  metric_threshold: 0.35
  router_mix_end: 0.5
  router_mix_start: 0.3
curriculum_phase1_end: 0.3
curriculum_phase2_end: 0.7
curriculum_phase3_end: 1.0
curriculum_phase_mode: three_phase
curvature: 1.0
distance_matrix_path: ./data/naics_distance_matrix.parquet
eval_every_n_epochs: 1
eval_sample_size: 300
false_negative_config:
  attraction_metric: cosine
  attraction_weight: 0.1
  strategy: eliminate
fn_cluster_every_n_epochs: 5
fn_curriculum_start_epoch: 10
fn_num_clusters: 500
hierarchy_weight: 0.325
learning_rate: 0.0001
load_balancing_coef: 0.01
lora_alpha: 16
lora_dropout: 0.1
lora_r: 8
moe_hidden_dim: 768
num_experts: 4
parent_eval_top_k: 1
radius_reg_weight: 0.01
rank_order_weight: 0.275
relations_parquet_path: ./data/naics_relations.parquet
sibling_distance_threshold: 2.0
temperature: 0.07
top_k: 2
tree_distance_alpha: 1.5
use_warmup_cosine: false
warmup_steps: 500
weight_decay: 0.01
