[project]
name = 'naics-embedder'
version = '0.2.0'
description = 'Cross-platform NAICS embeddings and text-hierarchy modeling project.'
requires-python = '>=3.10'

dependencies = [
    'torch>=2.4.0,!=2.5.1', # Exclude 2.5.1 which lacks macOS ARM64 wheels
    'pytorch-lightning>=2.4',
    'transformers[torch]>=4.46',
    'accelerate>=1.2',
    'peft>=0.13',
    'typer>=0.12',
    'polars>=1.9',
    'pyarrow>=17.0',
    'networkx>=3.4',
    'httpx>=0.28',
    'openpyxl>=3.1',
    'scipy>=1.13',
    'scikit-learn>=1.5',
    'tqdm>=4.67',
    "fastexcel>=0.16.0",
    "tensorboard>=2.20.0",
    "tensorboardx>=2.6.4",
    "pydantic>=2.12.4",
    "selenium>=4.38.0",
    "great-tables>=0.20.0",
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.0",
    "mkdocstrings>=0.30.1",
    "mkdocstrings-python>=1.14.0",
    "pymdown-extensions>=10.17.1",
    "torch-geometric>=2.7.0",
    "ipykernel>=7.1.0",
    "ipywidgets>=8.1.8",
    "matplotlib>=3.10.7",
    "mkdocs-awesome-nav>=3.2.0",
]

[project.scripts]
naics-embedder = 'naics_embedder.cli:app'


[dependency-groups]
dev = [
    'yapf>=0.43.0',
    'ruff>=0.6',
    'rich>=13.9',
    'yamllint>=1.37.1',
    'pytest>=8.3',
    'pytest-cov>=5.0',
    'pytest-mock>=3.14',
    'pytest-xdist>=3.6',
    'hypothesis>=6.100',
    'pytest-benchmark>=4.0',
    "jupyter>=1.1.1",
    "nbformat>=5.10.4",
    "nbclient>=0.10.2",
    'pre-commit>=3.8.0',
]


# -------------------------------------------------------------------------------------------------
# UV settings:
#   1. Package: build and install the project (editable). With no [build-system] table, uv would
#      otherwise treat it as a virtual project and install neither the package nor its CLI
#   2. Environments: resolve and lock only for macOS ARM64 and Linux x86_64
# -------------------------------------------------------------------------------------------------

[tool.uv]
package = true
environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]


# -------------------------------------------------------------------------------------------------
# Ruff configuration (linter + import sorting only; YAPF owns layout, so never run `ruff format`):
#   1. Single quotes, including docstrings
#   2. E501 limit of 105: headroom over YAPF's 100 for lines it cannot split
#   3. isort puts 1 blank line after imports, matching YAPF's top-level spacing
# -------------------------------------------------------------------------------------------------

[tool.ruff]
line-length = 105
indent-width = 4
target-version = 'py310'
extend-exclude = ['*.md', '*.ipynb']

[tool.ruff.lint]
# Linting rules
select = ['E', 'F', 'I', 'Q']

[tool.ruff.lint.flake8-quotes]
inline-quotes = 'single'
docstring-quotes = 'single'

[tool.ruff.lint.isort]
# The default (-1) wants 2 blank lines before a def/class that follows the imports; YAPF enforces 1,
# so the two tools would undo each other's fixes.
lines-after-imports = 1


# -------------------------------------------------------------------------------------------------
# YAPF - the code formatter; run it via scripts/format_code.sh
# -------------------------------------------------------------------------------------------------

[tool.yapf]
based_on_style = 'pep8'
column_limit = 100

# --- Spacing & blank lines (1 between top-level defs/classes) ---
blank_lines_around_top_level_definition = 1
blank_line_before_nested_class_or_def = true
join_multiple_lines = false

# --- Chaining and indentation ---
# split_before_dot only picks where an overflowing chain breaks; YAPF still packs chains onto as few
# lines as fit, so fence hand-aligned vertical chains with `# yapf: disable` / `# yapf: enable`.
split_before_dot = true
# Break before operators, so wrapped expressions start continuation lines with `+`, `-`, `and`, ...
split_before_logical_operator = true
split_before_arithmetic_operator = true
align_closing_bracket_with_visual_indent = true
dedent_closing_brackets = true
continuation_indent_width = 4
split_before_first_argument = false
split_before_closing_bracket = true

# --- Dict literals: keep each value on its key's line ---
allow_split_before_dict_value = false

# --- Split penalties: prefer fewer, longer lines (existing manual line breaks are not kept) ---
coalesce_brackets = false
split_penalty_after_opening_bracket = 10000
split_penalty_for_added_line_split = 10000
split_penalty_excess_character = 10000
allow_multiline_lambdas = true


# -------------------------------------------------------------------------------------------------
# Pytest configuration
# -------------------------------------------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ['tests']
python_files = ['test_*.py']
python_classes = ['Test*']
python_functions = ['test_*']
addopts = [
    '-v',
    '--strict-markers',
    '--tb=short',
]
markers = [
    'unit: Unit tests',
    'integration: Integration tests',
    'slow: Slow tests requiring significant compute',
    'gpu: Tests requiring GPU',
]
filterwarnings = [
    'ignore::DeprecationWarning',
    'ignore::PendingDeprecationWarning',
]


# -------------------------------------------------------------------------------------------------
# Coverage configuration
# -------------------------------------------------------------------------------------------------

[tool.coverage.run]
source = ['src/naics_embedder']
omit = [
    '*/tests/*',
    '*/__init__.py',
]

[tool.coverage.report]
exclude_lines = [
    'pragma: no cover',
    'def __repr__',
    'raise AssertionError',
    'raise NotImplementedError',
    'if __name__ == .__main__.:',
    'if TYPE_CHECKING:',
    '@abstractmethod',
]
precision = 2
show_missing = true

[tool.coverage.html]
directory = 'htmlcov'
